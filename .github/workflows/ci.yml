name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor permissao possivel: o job so le o codigo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Cross-compile (no CGO)
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/gateway
          done

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck (known vulnerabilities in deps and stdlib)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec (insecure code patterns)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude-generated ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg VERSION=${{ github.sha }} -t arcanum:ci .
      - name: Trivy (image vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: arcanum:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
