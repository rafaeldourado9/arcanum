name: Release

# Uma tag vX.Y.Z publica:
#  - binarios para Linux, macOS e Windows (GoReleaser) no GitHub Release, com checksums e
#    atestado de proveniencia;
#  - a imagem multi-arquitetura no GitHub Container Registry
#    (ghcr.io/rafaeldourado9/arcanum:X.Y.Z e :latest), com SBOM, proveniencia e assinatura
#    Cosign (keyless).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar o GitHub Release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip, dist/checksums.txt"

  npm:
    # Depois dos binarios: o `npx arcanum-gateway` baixa o binario cru desta release.
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          cd npm/arcanum-gateway && npm version "$v" --no-git-tag-version && cd ../..
          cd npm/create-arcanum && npm version "$v" --no-git-tag-version
          npm pkg set "dependencies.arcanum-gateway=$v"
      - name: Publish arcanum-gateway
        working-directory: npm/arcanum-gateway
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-arcanum
        working-directory: npm/create-arcanum
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # assinatura keyless do Cosign
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done
