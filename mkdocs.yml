site_name: Arcanum
site_description: Open-source, self-hosted WhatsApp gateway in Go. Multi-session, built-in anti-ban, signed webhooks.
site_url: https://arcanum.rafaeldourado.tech/
site_author: Rafael Dourado
repo_url: https://github.com/rafaeldourado9/arcanum
repo_name: rafaeldourado9/arcanum
edit_uri: edit/main/docs/
copyright: MIT License · Arcanum is not affiliated with WhatsApp or Meta.

theme:
  name: material
  language: pt
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/arcanum.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rafaeldourado9/arcanum
    - icon: fontawesome/solid/globe
      link: https://rafaeldourado.tech
  generator: false

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        # Portugues na raiz (/), ingles em /en/.
        - locale: pt
          default: true
          name: Português (BR)
          build: true
          site_description: Gateway de WhatsApp open source e auto-hospedado em Go. Múltiplas sessões, anti-ban nativo e webhooks assinados.
          nav_translations:
            Home: Início
            Guide: Guia
            Getting started: Primeiros passos
            Installation: Instalação
            Dashboard: Painel
            Authentication: Autenticação
            Sessions: Sessões
            Sending messages: Enviando mensagens
            Webhooks: Webhooks
            Anti-ban: Anti-ban
            Operations: Operação
            Tutorials: Treinamento
            Your first bot: Seu primeiro bot
            Human takeover: Atendimento humano
            Notify customers: Avisar clientes
            Move to a new server: Trocar de servidor
            Configuration: Configuração
            Deployment: Produção
            Security: Segurança
            Monitoring: Monitoramento
            Troubleshooting: Problemas comuns
            Reference: Referência
            API reference: Referência da API
        - locale: en
          name: English
          build: true
          site_description: Open-source, self-hosted WhatsApp gateway in Go. Multi-session, built-in anti-ban, signed webhooks.

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Installation: installation.md
      - Dashboard: dashboard.md
      - Authentication: authentication.md
      - Sessions: sessions.md
      - Sending messages: messages.md
      - Webhooks: webhooks.md
      - Anti-ban: anti-ban.md
  - Tutorials:
      - tutorials/index.md
      - Your first bot: tutorials/first-bot.md
      - Human takeover: tutorials/human-takeover.md
      - Notify customers: tutorials/notifications.md
      - Move to a new server: tutorials/move-server.md
  - Operations:
      - Configuration: configuration.md
      - Deployment: deployment.md
      - Security: security.md
      - Monitoring: monitoring.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - API reference: api-reference.md

markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
